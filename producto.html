<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mobile One POS — Producto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-frame">
    <div class="app-screen">
      <div class="topbar">
        <button class="icon-btn" id="btn-volver" aria-label="Volver"></button>
        <div class="topbar__titulos">
          <div class="topbar__titulo">Producto</div>
          <div class="topbar__subtitulo" id="subtitulo-producto"></div>
        </div>
      </div>

      <div class="contenido ficha" id="ficha-producto"></div>

      <div class="footer-total" id="footer-ficha" style="display:none"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("btn-volver").innerHTML = ICONS.back;
  </script>
</body>
</html>
