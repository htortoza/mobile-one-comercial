<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mobile One POS — Cobro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-frame">
    <div class="app-screen">
      <div class="topbar">
        <button class="icon-btn" id="btn-volver-cobro" aria-label="Volver"></button>
        <div class="topbar__titulos">
          <div class="topbar__titulo">Cobro</div>
          <div class="topbar__subtitulo" id="subtitulo-cobro"></div>
        </div>
      </div>

      <div class="contenido" id="contenido-cobro"></div>

      <div class="dialog-overlay" id="dialog-overlay">
        <div class="dialog-box" id="dialog-box"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("btn-volver-cobro").innerHTML = ICONS.back;
  </script>
</body>
</html>
